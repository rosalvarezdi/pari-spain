name: PARI Daily Update

on:
  schedule:
    # Cada día a las 07:00 CET (06:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo de la ejecución manual'
        required: false
        default: 'Actualización manual'

jobs:
  update-pari:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pytrends feedparser beautifulsoup4 pandas lxml

      - name: Create data directory if missing
        run: mkdir -p data docs

      - name: Collect PARI data
        run: |
          echo "🚀 Iniciando recolección de datos PARI..."
          python collect_data.py
        env:
          PYTHONUNBUFFERED: "1"
        # Continúa aunque falle (usará datos del día anterior si los hay)
        continue-on-error: true

      - name: Generate HTML dashboard
        run: |
          echo "📄 Generando dashboard..."
          python generate_html.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "PARI Bot"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "ℹ️ Sin cambios."
          else
            DATE=$(date '+%Y-%m-%d %H:%M UTC')
            git commit -m "🔄 PARI Update: ${DATE}"
            git push
            echo "✅ Dashboard actualizado."
          fi
